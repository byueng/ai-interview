server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the service after Compose recreates the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:7022;

    # Allow a 10 MiB PDF plus multipart fields; the API checks the file itself.
    client_max_body_size 11m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    location = /healthz {
        proxy_pass $backend/;
    }

    location /interview/ {
        proxy_pass $backend;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        proxy_pass $backend;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /character-journal/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
