[project]
name = "ai-interview"
version = "2.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "山吹乙女", email = "16100088+shan-chui-yi-nv@user.noreply.gitee.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
interview_agent = "agent_system:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
