[project]
name = "ai-interview"
version = "2.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "山吹乙女", email = "16100088+shan-chui-yi-nv@user.noreply.gitee.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langsmith>=0.14.9",
    "openai>=3.24.0",
    "pdfminer-six>=20251230",
    "pydantic>=2.13.5",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
interview_agent = "agent_system:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "langgraph-cli[inmem]>=0.4.37",
]
